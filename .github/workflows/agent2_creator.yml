name: Agent 2 - Creator

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Agent 2
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/agent2_creator.py

      - name: Commit PDF and database
        run: |
          git config user.name "Income Agent Bot"
          git config user.email "bot@agents.com"
          git add products.json output/
          git diff --staged --quiet || git commit -m "Agent 2: Product PDF created"
          git push
