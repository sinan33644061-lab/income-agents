name: Agent 4 - Traffic

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  traffic:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Agent 4
        env:
          GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
          DEVTO_API_KEY:            ${{ secrets.DEVTO_API_KEY }}
          TELEGRAPH_ACCESS_TOKEN:   ${{ secrets.TELEGRAPH_ACCESS_TOKEN }}
          MASTODON_ACCESS_TOKEN:    ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE:        https://mastodon.social
          TELEGRAM_TOKEN:           ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID:      ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python scripts/agent4_traffic.py

      - name: Commit updated database
        run: |
          git config user.name "Income Agent Bot"
          git config user.email "bot@agents.com"
          git add products.json
          git diff --staged --quiet || git commit -m "Agent 4: Traffic posted"
          git push
