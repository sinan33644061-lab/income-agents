name: Agent 4 - Traffic

on:
  schedule:
    - cron: '0 13 * * *'   # runs daily at 1pm UTC
  workflow_dispatch:        # also allows manual trigger

jobs:
  traffic:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Agent 4
        env:
          GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
          TWITTER_API_KEY:          ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:       ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:     ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET:    ${{ secrets.TWITTER_ACCESS_SECRET }}
          DEVTO_API_KEY:            ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_API_KEY:         ${{ secrets.HASHNODE_API_KEY }}
          HASHNODE_PUBLICATION_ID:  ${{ secrets.HASHNODE_PUBLICATION_ID }}
          BLOGGER_API_KEY:          ${{ secrets.BLOGGER_API_KEY }}
          BLOGGER_BLOG_ID:          ${{ secrets.BLOGGER_BLOG_ID }}
          TELEGRAM_TOKEN:           ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID:      ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python scripts/agent4_traffic.py

      - name: Commit updated database
        run: |
          git config user.name "Income Agent Bot"
          git config user.email "bot@agents.com"
          git add products.json
          git diff --staged --quiet || git commit -m "Agent 4: Traffic posted for new product"
          git push
