name: Agent 3 - Publisher

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Agent 3
        env:
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/agent3_publisher.py

      - name: Commit database
        run: |
          git config user.name "Income Agent Bot"
          git config user.email "bot@agents.com"
          git add products.json
          git diff --staged --quiet || git commit -m "Agent 3: Product published to Gumroad"
          git push
