name: Scout Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scout-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run scout script
        run: python gmap-agency/scout.py

      - name: Commit updated leads.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gmap-agency/leads.json
          git diff --staged --quiet || git commit -m "Update leads.json from scout run"
          git push
