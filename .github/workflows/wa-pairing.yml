name: WhatsApp Pairing (one-time)

on:
  workflow_dispatch:

jobs:
  pair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: gmap-agency/whatsapp

      - name: Run pairing script
        env:
          WA_PHONE_NUMBER: ${{ secrets.WA_PHONE_NUMBER }}
        run: |
          node pair.js &
          sleep 90
        working-directory: gmap-agency/whatsapp
